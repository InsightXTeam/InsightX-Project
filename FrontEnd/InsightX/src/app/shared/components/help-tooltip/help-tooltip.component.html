<button 
  #buttonRef
  type="button" 
  class="help-icon-btn" 
  [class.active]="isOpen()" 
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focus)="onMouseEnter()"
  (blur)="onMouseLeave()"
  (click)="$event.preventDefault(); $event.stopPropagation();"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="title ? 'Help for ' + title : 'Help information'">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="question-icon">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
  </svg>
</button>

@if (isOpen()) {
  <div 
    #popoverRef 
    class="tooltip-hint" 
    [style.top.px]="popoverTop()" 
    [style.left.px]="popoverLeft()"
    [style.opacity]="isPositioned() ? '1' : '0'"
    [style.pointer-events]="isPositioned() ? 'auto' : 'none'"
    (mouseenter)="onPopoverMouseEnter()"
    (mouseleave)="onPopoverMouseLeave()"
    role="tooltip">
    <div class="hint-desc">{{ description }}</div>
    @if (expectedType || example) {
      <div class="hint-meta">
        @if (expectedType) {
          <span class="hint-type">{{ expectedType }}</span>
        }
        @if (example) {
          <span class="hint-example"><span style="color: #64748b;">e.g.</span> {{ example }}</span>
        }
      </div>
    }
  </div>
}
