@if (authService.isAuthenticated()) {
  <div class="app-shell">
    <!-- Left Sidebar -->
    <app-sidenavbar [class.active]="isMobileMenuOpen()" (linkClicked)="closeMobileMenu()"></app-sidenavbar>
    
    <!-- Mobile Menu Overlay -->
    @if (isMobileMenuOpen()) {
      <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
    }
    
    <!-- Main Right Content Area -->
    <div class="app-main-layout">
      <!-- Top Header Navbar -->
      <header class="top-navbar">
        <div class="navbar-left" style="display: flex; align-items: center;">
          <!-- Hamburger Button for Mobile screens -->
          <button class="hamburger-btn" (click)="toggleMobileMenu()" type="button" aria-label="Toggle Navigation Menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" style="width: 22px; height: 22px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          </button>
        </div>
        
        <!-- Clickable Profile Info -->
        <div class="navbar-right" routerLink="/profile" title="View Profile">
          <div class="nav-profile-details">
            <span class="nav-user-name" [title]="userEmail()">{{ userName() }}</span>
            <span class="nav-user-role">{{ roleDisplay() }}</span>
          </div>
          <div class="nav-avatar">{{ userInitials() }}</div>
        </div>
      </header>

      <!-- Scrollable Main Page Canvas -->
      <main class="app-canvas">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <!-- Plain router outlet for login/registration/public views -->
  <router-outlet></router-outlet>
}

<app-toast-container></app-toast-container>
