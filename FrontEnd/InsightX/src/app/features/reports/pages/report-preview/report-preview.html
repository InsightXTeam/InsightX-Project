<div class="preview-container">
  <div class="preview-header">
    <button class="back-btn" routerLink="/reports">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"
        />
      </svg>
      Back to Reports
    </button>
    <div class="header-titles">
      <h1 class="page-title">Check Your Document Text</h1>
      <p class="page-subtitle">Review the text from your document before you continue.</p>
    </div>
  </div>

  <div class="handoff-alert">
    <div class="alert-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"
        />
      </svg>
    </div>
    <div class="alert-content">
      <h4>Review Your Text</h4>
      <p>
        Please check the text below and fix any mistakes. When it looks right, click
        <strong>"Confirm and Continue"</strong> to finish.
      </p>
    </div>
  </div>

  <div class="preview-card">
    @if (isLoading) {
      <div class="loading-state">
        <div class="spinner-large"></div>
        <p>Loading document text...</p>
      </div>
    } @else if (form) {
      <form [formGroup]="form" (ngSubmit)="confirmAndSave()" class="data-form">
        <div class="form-group mb-4">
          <label for="extractedText" class="form-label">Document Text</label>
          <textarea
            id="extractedText"
            class="input-field text-editor"
            formControlName="extractedText"
            placeholder="No text was found in this document."
            rows="15"
          >
          </textarea>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            class="submit-btn success-btn"
            [disabled]="isSaving || form.invalid"
          >
            @if (isSaving) {
              <span class="spinner"></span>
              <span>Processing...</span>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
              <span>Confirm and Continue</span>
            }
          </button>
        </div>
      </form>
    }
  </div>

  <app-toast-notification
    [open]="toastOpen()"
    [message]="toastMessage()"
    [type]="toastType()"
  ></app-toast-notification>
</div>
