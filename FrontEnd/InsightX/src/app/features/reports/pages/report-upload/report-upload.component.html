<div class="reports-container">
  <div class="upload-header">
    <h2>Upload Report</h2>
    <p>Supported formats: PDF, Excel, Word, Image (Max 50MB)</p>
  </div>

  <div class="premium-card upload-card">
    <div class="dropzone">
      <div class="dropzone-content">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="upload-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <h3>Drag your report here</h3>
        <span class="or-text">or</span>
        <button class="browse-btn">Browse Files</button>
      </div>
    </div>

    <div class="form-section">
      <label class="input-label">Assign to Department</label>
      <select class="premium-select full-width">
        <option>Select Department...</option>
        <option>Production</option>
        <option>Finance</option>
        <option>Engineering</option>
      </select>
    </div>

    <button class="primary-btn upload-submit-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      Upload Report
    </button>
  </div>

  <div class="premium-card upload-progress-card">
    <div class="progress-info">
      <div class="file-details">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="doc-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span class="filename">January_Production_Report.pdf</span>
      </div>
      <span class="percentage">65%</span>
      <button class="cancel-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div class="progress-bar-container">
      <div class="progress-bar" style="width: 65%;"></div>
    </div>
    
    <div class="extraction-status">
      <span class="pulse-dot"></span>
      Extracting data with AI...
    </div>
  </div>
</div>
