<div class="card premium-card alerts-card">
  <div class="card-header premium-header">
    <div class="header-content">
      <h3 class="card-title">Recent Alerts</h3>
    </div>
    <div class="header-actions">
      <a routerLink="/alerts" class="view-all-link">View All</a>
    </div>
  </div>
  
  <div class="card-body">
    <div class="alerts-list" *ngIf="alerts && alerts.length > 0; else noAlerts">
      <!-- TODO: Confirm alertType enum values mapping with backend (e.g. 0=Info, 1=Warning, 2=Critical) -->
      <div class="alert-item" *ngFor="let alert of alerts" [ngClass]="{
        'unseen-alert': !alert.seenByOwner,
        'alert-warning': alert.alertType === 1,
        'alert-critical': alert.alertType === 2
      }" routerLink="/alerts">
        <div class="alert-icon">
          <svg *ngIf="alert.alertType === 1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-warning"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <svg *ngIf="alert.alertType === 2" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-critical"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <svg *ngIf="alert.alertType !== 1 && alert.alertType !== 2" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-info"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </div>
        
        <div class="alert-content">
          <div class="alert-header-row">
            <h4 class="alert-kpi" [class.font-bold]="!alert.seenByOwner">{{ alert.kpiName }}</h4>
            <span class="unseen-badge" *ngIf="!alert.seenByOwner">NEW</span>
          </div>
          <p class="alert-message">{{ alert.message }}</p>
          <p class="alert-recommendation" *ngIf="alert.recommendation">
            <span class="rec-label">Recommendation:</span> {{ alert.recommendation }}
          </p>
          <div class="alert-meta">
            {{ alert.createdAt | date:'short' }} &bull; {{ alert.recommendation ? 'AI Assisted' : 'System Generated' }}
          </div>
        </div>
      </div>
    </div>
    
    <ng-template #noAlerts>
      <div class="empty-state">
        <p>No recent alerts found.</p>
      </div>
    </ng-template>
  </div>
</div>
