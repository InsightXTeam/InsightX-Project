<div class="card premium-card trend-card">
  <div class="card-header premium-header">
    <div class="header-content">
      <h3 class="card-title">Trend Analysis</h3>
      <p class="card-subtitle">6-Month Historical Performance</p>
    </div>
  </div>

  <!-- Pill Tab Bar Switcher -->
  <div class="pill-tabs-bar" *ngIf="trends && trends.length > 0">
    <button
      *ngFor="let trend of trends"
      type="button"
      class="pill-tab"
      [class.active]="selectedKpiName === trend.kpiName || (!selectedKpiName && trend === trends[0])"
      (click)="selectKpi(trend.kpiName)">
      {{ trend.kpiName }}
    </button>
  </div>

  <div class="card-body">
    <div class="chart-container" *ngIf="trends && trends.length > 0 && hasHistoryData(); else noData">
      <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [stroke]="chartOptions.stroke"
        [dataLabels]="chartOptions.dataLabels"
        [colors]="chartOptions.colors"
        [markers]="chartOptions.markers"
        [tooltip]="chartOptions.tooltip"
        [grid]="chartOptions.grid"
        [yaxis]="chartOptions.yaxis"
        [fill]="chartOptions.fill"
      ></apx-chart>
    </div>
    
    <ng-template #noData>
      <div class="empty-state isometric-empty-state">
        <div class="empty-icon-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"></path>
            <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path>
          </svg>
        </div>
        <h4>No Historical Data Recorded</h4>
        <p>There is currently no 6-month historical trend recorded for <strong>{{ selectedKpiName || 'this KPI' }}</strong> yet. Data will appear automatically as monthly reports are submitted.</p>
      </div>
    </ng-template>
  </div>
</div>
