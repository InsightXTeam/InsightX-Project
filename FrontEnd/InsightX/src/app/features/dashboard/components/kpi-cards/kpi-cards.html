<div class="kpi-grid">
  <div class="kpi-card" *ngFor="let kpi of kpis; let i = index" [style.animation-delay]="i * 0.05 + 's'">
    <div class="kpi-header">
      <h3 class="kpi-title">{{ kpi.name }}</h3>
      
      <div class="kpi-icon" [ngClass]="{
        'icon-good': kpi.status === 'Good',
        'icon-warning': kpi.status === 'Warning',
        'icon-critical': kpi.status === 'Critical'
      }">
        <svg *ngIf="kpi.status === 'Good'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <svg *ngIf="kpi.status === 'Warning'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <svg *ngIf="kpi.status === 'Critical'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      </div>
    </div>
    
    <div class="kpi-body">
      <div class="kpi-value-wrapper">
        <span class="kpi-value">{{ kpi.currentValue | number:'1.0-2' }}</span>
        <span class="kpi-unit" *ngIf="kpi.unit">{{ kpi.unit }}</span>
      </div>
      
      <div class="kpi-status-text" [ngClass]="{
        'text-good': kpi.status === 'Good',
        'text-warning': kpi.status === 'Warning',
        'text-critical': kpi.status === 'Critical'
      }">
        {{ kpi.status === 'Good' ? 'ON TRACK' : kpi.status === 'Warning' ? 'WARNING' : 'BELOW TARGET' }}
      </div>
    </div>
  </div>
</div>
