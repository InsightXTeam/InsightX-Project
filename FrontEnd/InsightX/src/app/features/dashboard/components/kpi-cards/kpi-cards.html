<div class="kpi-grid" *ngIf="kpis && kpis.length > 0">
  <div class="kpi-card" *ngFor="let kpi of kpis; let i = index" [ngClass]="{
    'card-good': kpi.status === 'Good',
    'card-warning': kpi.status === 'Warning',
    'card-critical': kpi.status === 'Critical'
  }" [style.animation-delay]="i * 0.05 + 's'">
    
    <div class="kpi-header">
      <h3 class="kpi-title" [title]="kpi.name">{{ kpi.name }}</h3>
      
      <div class="kpi-icon-wrapper" [ngClass]="{
        'icon-good': kpi.status === 'Good',
        'icon-warning': kpi.status === 'Warning',
        'icon-critical': kpi.status === 'Critical'
      }">
        <svg *ngIf="kpi.status === 'Good'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <svg *ngIf="kpi.status === 'Warning'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <svg *ngIf="kpi.status === 'Critical'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      </div>
    </div>
    
    <div class="kpi-body">
      <div class="kpi-value-wrapper">
        <span class="kpi-value">{{ kpi.currentValue | number:'1.0-2' }}</span>
        <span class="kpi-unit" *ngIf="kpi.unit">{{ kpi.unit }}</span>
      </div>
      
      <div class="kpi-footer">
        <div class="kpi-status-badge" [ngClass]="{
          'badge-good': kpi.status === 'Good',
          'badge-warning': kpi.status === 'Warning',
          'badge-critical': kpi.status === 'Critical'
        }">
          <span class="status-dot"></span>
          {{ getStatusLabel(kpi) }}
        </div>

        <div class="kpi-threshold" *ngIf="kpi.threshold !== undefined && kpi.threshold !== null">
          <span class="threshold-label">Target:</span> {{ kpi.threshold | number:'1.0-2' }}{{ kpi.unit }}
        </div>
      </div>
    </div>
  </div>
</div>

<div class="empty-state-card" *ngIf="!kpis || kpis.length === 0">
  <div class="empty-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
  </div>
  <h4>No Vital Signs Available Yet</h4>
  <p>KPI metrics will appear here automatically once reports containing their data are uploaded and confirmed.</p>
</div>
