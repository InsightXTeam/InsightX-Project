<div class="sidenav-container d-flex flex-column justify-content-between p-3">
  <div>
    <!-- Logo -->
    <div class="logo-section d-flex align-items-center mb-4 px-2">
      <div class="logo-icon me-2 d-flex align-items-center justify-content-center">
        <i class="bi bi-hexagon-fill text-indigo fs-4"></i>
      </div>
      <span class="logo-text fw-bold fs-5 tracking-wide">InsightX <span class="text-indigo">AI</span></span>
    </div>

    <!-- Navigation Menu -->
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item mb-2">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link d-flex align-items-center px-3 py-2 text-white">
          <i class="bi bi-grid-1x2-fill me-3 fs-5"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/chat" routerLinkActive="active" class="nav-link d-flex align-items-center px-3 py-2 text-white">
          <i class="bi bi-chat-right-quote-fill me-3 fs-5"></i>
          <span>AI Agent Chat</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/reports" routerLinkActive="active" class="nav-link d-flex align-items-center px-3 py-2 text-white opacity-50">
          <i class="bi bi-file-earmark-bar-graph-fill me-3 fs-5"></i>
          <span>Reports Upload</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/alerts" routerLinkActive="active" class="nav-link d-flex align-items-center px-3 py-2 text-white opacity-50">
          <i class="bi bi-bell-fill me-3 fs-5"></i>
          <span>Alerts Log</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- User Profile Section -->
  <div class="profile-section p-3 rounded glass-panel mb-2" *ngIf="currentUser">
    <div class="d-flex align-items-center mb-3">
      <div class="avatar me-2 d-flex align-items-center justify-content-center fw-bold">
        {{ currentUser.username.substring(0, 2).toUpperCase() }}
      </div>
      <div class="user-details overflow-hidden">
        <h6 class="mb-0 text-white text-truncate fw-semibold">{{ currentUser.username }}</h6>
        <span class="badge text-white font-xs px-2 py-1 mt-1" [ngClass]="getRoleBadgeClass()">
          {{ getRoleLabel() }}
        </span>
      </div>
    </div>
    
    <button class="btn btn-outline-danger w-100 btn-sm d-flex align-items-center justify-content-center" (click)="logout()">
      <i class="bi bi-box-arrow-left me-2"></i>
      Logout
    </button>
  </div>
</div>
