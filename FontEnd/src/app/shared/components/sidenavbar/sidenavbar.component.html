<nav class="sidenav">

  <!-- Brand -->
  <div class="sidenav__brand">
    <div class="brand-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z" fill="#3B82F6" opacity="0.9"/>
        <path d="M14 14h7v7h-7z" fill="#3B82F6" opacity="0.5"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">InsightX AI</span>
      <span class="brand-sub">Enterprise BI</span>
    </div>
  </div>

  <!-- New Analysis CTA -->
  <button class="new-analysis-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    New Analysis
  </button>

  <!-- Navigation -->
  <ul class="sidenav__nav">
    @for (item of navItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="nav-item"
          [attr.aria-label]="item.label"
        >
          <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <!-- Footer -->
  <div class="sidenav__footer">
    @if (user(); as u) {
      <div class="user-info">
        <div class="user-avatar">{{ u.name[0] | uppercase }}</div>
        <div class="user-meta">
          <span class="user-name">{{ u.name }}</span>
          <span class="user-role">{{ u.role }}</span>
        </div>
      </div>
    }
    <button class="sign-out-btn" (click)="logout()" id="sign-out-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign Out
    </button>
  </div>
</nav>
