<div class="auth-container">
  <div class="auth-wrapper">
    <!-- Header Area -->
    <div class="auth-header">
      <div class="brand-title">
        <!-- Upward Trending Graph Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="header-icon">
          <rect x="3" y="14" width="3" height="6" rx="0.5" fill="#3b82f6" />
          <rect x="9" y="10" width="3" height="10" rx="0.5" fill="#3b82f6" />
          <rect x="15" y="6" width="3" height="14" rx="0.5" fill="#3b82f6" />
          <path d="M3 15 L9 11 L15 7 L21 3" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M16 3 H21 V8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>InsightX AI</span>
      </div>
      <div class="badge-subtitle">Business Intelligence, Powered by AI</div>
    </div>

    <!-- Main Login Card -->
    <div class="auth-card">
      <!-- Error Alert Box -->
      @if (errorMessage()) {
        <div class="alert-error" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" autocomplete="on">
        <!-- Work Email -->
        <div class="form-group">
          <label for="email" class="form-label">Work Email</label>
          <div class="input-wrapper">
            <input
              id="email"
              type="email"
              formControlName="email"
              class="form-input"
              placeholder="you@company.com"
              autocomplete="email"
              required
            />
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
            <a href="javascript:void(0)" class="forgot-password">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <button type="button" class="eye-toggle-btn" (click)="togglePasswordVisibility()" aria-label="Toggle Password Visibility">
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading()">
          @if (isLoading()) {
            <span class="spinner"></span>
            <span>Signing in...</span>
          } @else {
            <span>Sign In &rarr;</span>
          }
        </button>
      </form>

      <div class="or-separator">OR</div>

      <div class="register-promo">
        Don't have an account? <a routerLink="/auth/register" class="promo-link">Register your company</a>
      </div>
    </div>

    <!-- Footer Area -->
    <footer class="login-footer">
      <p class="footer-copy">&copy; 2024 InsightX AI. All rights reserved.</p>
      <div class="footer-links">
        <a href="javascript:void(0)">Privacy Policy</a>
        <a href="javascript:void(0)">Terms of Service</a>
      </div>
    </footer>
  </div>
</div>
