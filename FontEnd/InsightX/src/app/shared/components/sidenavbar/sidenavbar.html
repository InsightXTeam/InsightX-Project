<div class="sidebar" [class.collapsed]="isCollapsed()">
  <!-- Brand Section -->
  <div class="brand-section">
    <div class="brand-info">
      <div class="logo-icon">IX</div>
      <span class="brand-name">InsightX</span>
    </div>
    <button class="toggle-btn" (click)="toggleCollapse()" type="button" aria-label="Toggle Sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 16px; height: 16px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" *ngIf="!isCollapsed()" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" *ngIf="isCollapsed()" />
      </svg>
    </button>
  </div>

  <!-- Navigation Menu -->
  <ul class="nav-menu">
    <!-- Reports (Owner, Manager) -->
    @if (role() === 'Owner' || role() === 'Manager') {
      <li class="nav-item">
        <a class="nav-link" routerLink="/reports" routerLinkActive="active">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
            </svg>
          </span>
          <span class="nav-label">Reports</span>
        </a>
        <div class="nav-tooltip">Reports</div>
      </li>
    }
  </ul>

  <!-- User Footer Section -->
  <div class="user-footer">
    <div class="user-profile" style="cursor: pointer;" title="View Profile">
      <div class="avatar">{{ userInitials() }}</div>
      <div class="user-details">
        <span class="user-name" title="manager@insightx.com">Manager User</span>
        <span class="user-role">{{ roleDisplay() }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="onLogout()" type="button" title="Log out">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 18px; height: 18px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
      </svg>
    </button>
  </div>
</div>
